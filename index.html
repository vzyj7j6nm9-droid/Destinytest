<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>데스티니 NPC 테스트</title>
<style>
:root{--bg:#050a1a;--edge:rgba(140,170,255,.28);--panel:rgba(22,36,72,.55);--text:#eef2ff;--sub:#a4b2d6;--acc:#8fb8ff;--btn:linear-gradient(180deg,#4468b8,#2a4485);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:#050a1a;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:radial-gradient(120% 60% at 50% 0,#12224a 0,var(--bg) 70%) fixed;color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
.screen{max-width:430px;min-height:100%;margin:0 auto;padding:22px 20px 28px;display:flex;flex-direction:column;position:relative;overflow:hidden}
[hidden]{display:none!important}
.logo{letter-spacing:.45em;font-size:13px;color:var(--sub);text-align:center}
.cta,.btn{border:1px solid var(--edge);border-radius:8px;background:rgba(30,48,96,.6);padding:13px 16px;font-size:16px}
.cta,.btn.main{background:var(--btn);border-color:#6e93e6}
.btn[disabled]{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* 인트로 */
.intro h1{font-size:32px;line-height:1.3;text-align:center;margin:14px 0 12px;letter-spacing:-.02em}
.intro .sub{text-align:center;color:var(--sub);font-size:14px;margin:0}
.planet{position:absolute;left:50%;top:26%;width:78%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 34% 30%,#e3ecff,#7d9ad8 38%,#1d2d5c 74%,transparent 76%);opacity:.5}
.party{flex:1;display:flex;justify-content:center;align-items:flex-end;position:relative;margin:0 -10px;min-height:250px}
.party i{width:38%;aspect-ratio:1;margin:0 -4%;background-size:cover;background-position:top;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.party i:nth-child(2){width:44%;z-index:1}
.qt{text-align:center;color:#dbe6ff;margin:14px 0 14px;font-size:15px}
/* 문항 */
.qhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.qhead b{font-size:22px;letter-spacing:.04em}
.qhead span{color:var(--sub);font-size:14px}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f78d8,#cfe0ff);transition:width .25s}
#qt{font-size:19px;line-height:1.45;margin:0 0 16px}
.banner{display:flex;height:112px;border:1px solid var(--edge);border-radius:8px;overflow:hidden;margin-bottom:16px}
.banner i{flex:1;background-size:cover;background-position:50% 18%}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px 14px;margin-bottom:10px;font-size:16px}
.opt b{flex:none;width:30px;height:30px;border-radius:5px;display:grid;place-items:center;background:rgba(255,255,255,.85);color:#101a38;font-size:15px}
.opt.on{border-color:#a9c6ff;background:rgba(60,96,190,.45)}
.nav{display:flex;gap:12px;margin-top:auto;padding-top:18px}
.nav .btn{flex:1}
.hint{color:var(--sub);font-size:13px;min-height:20px;margin-top:8px;text-align:center}
/* 결과 */
.hero{position:relative;margin:-22px -20px 0;aspect-ratio:1/1.05;background-size:cover;background-position:top}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,var(--bg) 96%)}
.hero .tx{position:absolute;left:0;right:0;bottom:6px;z-index:1;text-align:center}
.hero small{font-size:17px;color:#dbe6ff}
.hero h1{font-size:46px;line-height:1.1;margin:2px 0}
.hero em{font-style:normal;font-size:14px;letter-spacing:.14em;color:var(--sub)}
.quote{text-align:center;font-size:19px;margin:8px 0 12px;line-height:1.45}
.desc{text-align:center;color:#cbd6f2;font-size:15px;margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.chips span,.tags span{border:1px solid var(--edge);border-radius:6px;padding:4px 10px;font-size:14px;background:var(--panel)}
h3{font-size:16px;color:#ffd77a;margin:20px 0 10px}
.rk span:nth-child(3){white-space:nowrap;font-size:14px}.rk{display:grid;grid-template-columns:22px 26px 92px 1fr 40px;gap:8px;align-items:center;margin-bottom:10px;font-size:15px}
.rk .n{color:var(--sub);font-size:13px;text-align:center;border:1px solid var(--edge);border-radius:4px}
.face{width:24px;height:24px;border-radius:50%;background-size:260%;background-position:50% 35%;border:1px solid var(--edge)}
.trk{height:9px;background:rgba(255,255,255,.14);border-radius:5px;overflow:hidden}
.trk i{display:block;height:100%;width:0;border-radius:5px;background:#e6edff;transition:width .6s}
.pc{text-align:right;color:var(--sub);font-size:14px}
.two{display:flex;gap:12px;margin-top:22px}
.two .btn{flex:1;padding:13px 8px;font-size:15px}
.links{display:flex;justify-content:center;gap:22px;margin-top:16px}
.links button{background:none;border:0;color:var(--acc);font-size:15px;text-decoration:underline;padding:6px}
.toast{text-align:center;color:#ffd77a;font-size:14px;min-height:20px;margin-top:8px}
/* 상세 */
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dh b{font-size:20px}.dh .logo{letter-spacing:.3em}
.dp{background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:12px 14px;font-size:15px}
.dp ul{margin:0;padding:0;list-style:none}.dp li{padding:5px 0}.dp li::before{content:"◆";color:var(--acc);font-size:10px;margin-right:10px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.cl{display:grid;grid-template-columns:30px 48px 1fr 42px;gap:8px;align-items:center;margin-bottom:10px;font-size:15px}
.cl b{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:rgba(255,255,255,.14);font-size:13px}
.els{display:flex;justify-content:space-around;text-align:center;font-size:14px}
.els i{display:block;width:44px;height:44px;border-radius:50%;margin:0 auto 4px}
.last{text-align:center;font-size:18px;margin:22px 0 6px;line-height:1.5}
.last small{display:block;text-align:right;color:var(--sub);font-size:14px}
/* 모달 */
#modal{position:fixed;inset:0;background:rgba(3,6,16,.92);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#modal img{max-width:100%;max-height:74%;border-radius:8px}
#modal p{margin:0;color:var(--sub);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="s-intro" class="screen intro">
  <div class="planet"></div>
  <div class="logo">DESTINY</div>
  <h1>당신은 어떤<br>데스티니 NPC인가?</h1>
  <p class="sub">당신의 선택으로 알아보는<br>데스티니 가디언즈 속 인물 유형 테스트</p>
  <div class="party" id="party"></div>
  <p class="qt">“빛은 언제나, 당신 안에 있다.”</p>
  <button class="cta" id="start">테스트 시작하기 ›</button>
</section>

<section id="s-quiz" class="screen" hidden>
  <div class="qhead"><b id="qn"></b><span id="qp"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <p id="qt"></p>
  <div class="banner" id="banner"></div>
  <div id="opts"></div>
  <div class="nav">
    <button class="btn" id="prev">‹ 이전</button>
    <button class="btn main" id="next">다음 ›</button>
  </div>
  <div class="hint" id="hint"></div>
</section>

<section id="s-result" class="screen" hidden></section>
<section id="s-detail" class="screen" hidden></section>

<div id="modal" hidden>
  <img id="mimg" alt="결과 이미지">
  <p>이미지를 길게 눌러 저장하세요.</p>
  <button class="btn" id="mclose">닫기</button>
</div>

el:{n:"엘시 브레이",en:"ELSIE BRAY",q:"과거를 알기에, 나는 더 나은 미래를 선택한다.",d:"당신은 냉철한 판단력과 미래를 보는 통찰력을 지닌 수호자입니다. 과거의 경험을 바탕으로 더 나은 가능성을 만들기 위해 뻗어나가며, 끊임없이 앞으로 나아갑니다.",t:["통찰","냉철함","준비","희망"],b:"당신은 미리 준비하고 한 수 앞을 읽는 타입입니다. 차분한 판단으로 위험을 줄이고, 팀이 더 나은 선택을 하도록 돕습니다.",cls:[10,20,70],r:["사전 정찰과 작전 준비","정밀 저격 지원","위험 예측과 회피 안내"],el:[3,0,4],l:"준비된 자에게 미래는 기회가 된다.",c:"#6fb7e8"},
ca:{n:"케이드-6",en:"CAYDE-6",q:"인생은 너무 짧아, 재미있게 살자.",d:"당신은 자유롭고 유쾌한 성격으로 주변에 활력을 불어넣는 수호자입니다. 위기 속에서도 웃음을 잃지 않으며, 동료들을 위해 기꺼이 싸우는 따뜻한 마음을 지녔습니다.",t:["자유","유머","모험","우정"],b:"당신은 무거운 분위기를 가볍게 바꾸는 타입입니다. 자유로운 태도 뒤에 동료를 향한 의리가 단단히 자리하고 있습니다.",cls:[8,10,82],r:["분위기 메이커","돌발 상황 해결사","탐험과 보물 사냥"],el:[1,0,2],l:"웃을 수 있을 때 실컷 웃어 둬.",c:"#e2673f"},
cr:{n:"크로우",en:"CROW",q:"누구나, 다시 시작할 수 있다.",d:"당신은 과거의 그림자를 넘어 새로운 길을 걸어가는 수호자입니다. 실수와 상처를 받아들여 성장하며, 동료들과의 유대를 소중히 여기는 따뜻한 마음을 지녔습니다.",t:["공감","성장","구원","유대"],b:"당신은 실수와 상처를 딛고 앞으로 나아가는 타입입니다. 다른 사람의 아픔을 알아보고 곁에 서 주는 공감이 강점입니다.",cls:[12,22,66],r:["팀의 정서적 유대 담당","재도전을 돕는 조력자","기동 정찰과 기습"],el:[4,0,3],l:"오늘이 다시 시작하는 날이야.",c:"#8a96b3"},
dr:{n:"드리프터",en:"THE DRIFTER",q:"세상은 생각보다 단순해, 살아남는 게 답이지.",d:"당신은 현실적이고 유연한 사고를 지닌 생존자입니다. 어떤 상황에서도 기회를 찾아내며, 자신의 방식으로 목표를 이루기 위해 움직이는 독특한 수호자입니다.",t:["현실감각","생존","기회","독창성"],b:"당신은 이상보다 현실을 먼저 보는 타입입니다. 규칙에 얽매이지 않고 기회를 포착해, 자기만의 방식으로 결과를 만듭니다.",cls:[10,14,76],r:["실속 챙기는 협상가","변칙 플레이 담당","생존 전문 솔로 플레이"],el:[1,4,2],l:"살아남았다면, 이미 절반은 이긴 거야.",c:"#3fbf8f"},
ba:{n:"밴시-44",en:"BANSHEE-44",q:"좋은 장비는 좋은 수호자를 만든다.",d:"당신은 묵묵히 자신의 자리에서 최선을 다하는 장인입니다. 세심함과 성실함으로 동료들을 지원하며, 작은 부분까지 놓치지 않는 신뢰받는 수호자입니다.",t:["장인정신","정확함","지원","신뢰"],b:"당신은 눈에 띄지 않는 곳에서 팀을 받치는 타입입니다. 작은 부분까지 챙기는 꼼꼼함으로 모두가 믿고 맡길 수 있는 사람입니다.",cls:[40,20,40],r:["장비 정비와 세팅","팀 보급 지원","세부 준비 점검"],el:[2,1,0],l:"손보고 다듬으면 못 할 게 없지.",c:"#e0913f"}
};
const EL = [["공허","#a273e6"],["태양","#f0a03a"],["전격","#5aa9ff"],["시공","#5cd0ff"],["가닥","#4fd18b"]];
const CL = [["타이탄","타"],["워록","워"],["헌터","헌"]];
const IDS = Object.keys(D);
const $ = id => document.getElementById(id);
const bg = k => `background-image:url(${IMG[k]})`;
const answers = Array(QS.length).fill(null);
let cur = 0, R = null;

function show(n){ ["intro","quiz","result","detail"].forEach(s=>$("s-"+s).hidden = s!==n); window.scrollTo(0,0); }

$("party").innerHTML = ["cr","za","ik"].map(k=>`<i style="${bg(k)}"></i>`).join("");
$("start").onclick = () => { cur = 0; renderQ(); show("quiz"); };

function renderQ(){
  const [t,opts] = QS[cur], p = Math.round((cur+1)/QS.length*100);
  $("qn").textContent = `Q. ${cur+1} / ${QS.length}`;
  $("qp").textContent = p + "%"; $("fill").style.width = p + "%";
  $("qt").textContent = t; $("hint").textContent = "";
  $("banner").innerHTML = [0,1,2].map(j=>`<i style="${bg(IDS[(cur*3+j)%12])}"></i>`).join("");
  const box = $("opts"); box.innerHTML = "";
  opts.forEach((o,i)=>{
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt" + (answers[cur]===i ? " on" : "");
    b.innerHTML = `<b>${"ABCD"[i]}</b><span></span>`; b.lastChild.textContent = o[0];
    b.onclick = () => { answers[cur] = i; [...box.children].forEach((x,j)=>x.classList.toggle("on", j===i)); $("next").disabled = false; };
    box.appendChild(b);
  });
  $("prev").disabled = cur===0;
  $("next").disabled = answers[cur]===null;
  $("next").textContent = cur===QS.length-1 ? "결과 보기 ›" : "다음 ›";
}
$("prev").onclick = () => { if(cur>0){ cur--; renderQ(); } };
$("next").onclick = () => {
  if(answers[cur]===null){ $("hint").textContent = "답을 하나 선택해 주세요."; return; }
  if(cur < QS.length-1){ cur++; renderQ(); } else finish();
};

function finish(){
  const score = {}, last = {};
  IDS.forEach(k=>{ score[k]=0; last[k]=-1; });
  answers.forEach((a,qi)=>{ const o = QS[qi][1][a]; score[o[1]]+=2; last[o[1]]=qi; score[o[2]]+=1; if(last[o[2]]<qi) last[o[2]]=qi; });
  const total = IDS.reduce((s,k)=>s+score[k],0);
  const order = [...IDS].sort((a,b)=> score[b]-score[a] || last[b]-last[a]);
  const cls = [0,0,0];
  IDS.forEach(k=>{ const w = Math.pow(score[k],3); D[k].cls.forEach((v,i)=>cls[i]+=v*w); });
  const cs = cls.reduce((a,b)=>a+b,0);
  const cp = cls.map(v=>Math.round(v/cs*100));
  cp[cp.indexOf(Math.max(...cp))] += 100 - cp.reduce((a,b)=>a+b,0);
  R = { win:order[0], order, score, cp, pct:k=>Math.round(score[k]/total*100) };
  renderResult(); show("result");
}

function renderResult(){
  const {win,order,score,pct} = R, d = D[win];
  const base = Math.min(98, Math.round(64 + 72*score[win]/48));
  const chips = d.t.map((t,i)=>`<span>${t} ${Math.max(55, base-i*5)}</span>`).join("");
  const rows = order.slice(0,4).map((k,i)=>`<div class="rk"><span class="n">${i+1}</span><span class="face" style="${bg(k)}"></span><span>${D[k].n}</span><div class="trk"><i data-w="${Math.round(pct(k)/pct(win)*100)}"></i></div><span class="pc">${pct(k)}%</span></div>`).join("");
  $("s-result").innerHTML = `
    <div class="hero" style="${bg(win)}"><div class="tx"><small>당신은</small><h1>${d.n}</h1><em>${d.en}</em></div></div>
    <p class="quote">“${d.q}”</p>
    <p class="desc">${d.d}</p>
    <div class="chips">${chips}</div>
    <h3>다른 NPC 적합도</h3>${rows}
    <div class="two"><button class="btn" id="save">결과 이미지 저장</button><button class="btn" id="share">공유하기</button></div>
    <div class="toast" id="toast"></div>
    <div class="links"><button id="more">상세 분석 보기</button><button id="again">다시 하기</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".trk i").forEach(e=>e.style.width = e.dataset.w+"%")));
  $("more").onclick = () => { renderDetail(); show("detail"); };
  $("again").onclick = () => { answers.fill(null); show("intro"); };
  $("save").onclick = saveImage;
  $("share").onclick = async () => {
    const txt = `나는 데스티니 NPC 중 ${d.n}! (${order.slice(0,3).map(k=>D[k].n+" "+pct(k)+"%").join(", ")})`;
    try{ if(navigator.share){ await navigator.share({title:"데스티니 NPC 테스트",text:txt}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
    try{ await navigator.clipboard.writeText(txt); $("toast").textContent = "결과를 복사했습니다."; }
    catch(e){ $("toast").textContent = txt; }
  };
}

function renderDetail(){
  const d = D[R.win];
  const cl = R.cp.map((v,i)=>`<div class="cl"><b>${CL[i][1]}</b><span>${CL[i][0]}</span><div class="trk"><i data-w="${v}"></i></div><span class="pc">${v}%</span></div>`).join("");
  const els = d.el.map(i=>`<div><i style="background:radial-gradient(circle at 35% 30%,#fff8,${EL[i][1]} 60%,#0008)"></i>${EL[i][0]}</div>`).join("");
  $("s-detail").innerHTML = `
    <div class="dh"><b>상세 분석</b><span class="logo">DESTINY</span></div>
    <h3>기본 성향</h3><p style="margin:0;font-size:15px;color:#d5def6">${d.b}</p>
    <h3>키워드</h3><div class="tags">${d.t.map(t=>`<span>#${t}</span>`).join("")}</div>
    <h3>수호자 클래스 적성</h3>${cl}
    <h3>잘 어울리는 역할</h3><div class="dp"><ul>${d.r.map(r=>`<li>${r}</li>`).join("")}</ul></div>
    <h3>당신에게 추천하는 빛의 속성</h3><div class="els">${els}</div>
    <p class="last">“${d.l}”<small>— ${d.n}</small></p>
    <div class="nav"><button class="btn" id="back">‹ 결과로</button><button class="btn main" id="again2">다시 하기</button></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll("#s-detail .trk i").forEach(e=>e.style.width = e.dataset.w+"%")));
  $("back").onclick = () => show("result");
  $("again2").onclick = () => { answers.fill(null); show("intro"); };
}

function wrap(g,text,max){ const out=[]; let line=""; for(const ch of text){ if(g.measureText(line+ch).width>max){ out.push(line); line=ch; } else line+=ch; } out.push(line); return out; }
function saveImage(){
  const {win,order,pct} = R, d = D[win];
  const im = new Image();
  im.onload = () => {
    const W=720, H=1260, c=document.createElement("canvas"); c.width=W; c.height=H;
    const g=c.getContext("2d"), F='"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
    g.fillStyle="#060c1f"; g.fillRect(0,0,W,H);
    const ih=W*im.height/im.width; g.drawImage(im,0,0,W,ih);
    const gr=g.createLinearGradient(0,ih-340,0,ih); gr.addColorStop(0,"rgba(6,12,31,0)"); gr.addColorStop(1,"#060c1f"); g.fillStyle=gr; g.fillRect(0,ih-340,W,340);
    g.textAlign="center";
    g.fillStyle="#dbe6ff"; g.font=`28px ${F}`; g.fillText("당신은",W/2,ih-170);
    g.fillStyle="#fff"; g.font=`bold 92px ${F}`; g.fillText(d.n,W/2,ih-78);
    g.fillStyle="#a4b2d6"; g.font=`24px ${F}`; g.fillText(d.en,W/2,ih-34);
    g.fillStyle="#eef2ff"; g.font=`30px ${F}`;
    let y=ih+40; wrap(g,"“"+d.q+"”",620).forEach(l=>{ g.fillText(l,W/2,y); y+=44; });
    y+=30; g.textAlign="left";
    order.slice(0,4).forEach((k,i)=>{
      g.fillStyle="#eef2ff"; g.font=`26px ${F}`; g.fillText(`${i+1}  ${D[k].n}`,60,y);
      g.fillStyle="rgba(255,255,255,.15)"; g.fillRect(300,y-16,290,12);
      g.fillStyle="#e6edff"; g.fillRect(300,y-16,290*pct(k)/pct(win),12);
      g.textAlign="right"; g.fillStyle="#a4b2d6"; g.fillText(pct(k)+"%",660,y); g.textAlign="left"; y+=58;
    });
    g.textAlign="center"; g.fillStyle="#6f7fa8"; g.font=`20px ${F}`; g.fillText("DESTINY NPC TEST",W/2,H-34);
    c.toBlob(async blob => {
      const name = `destiny-npc-${win}.png`;
      if(blob){
        if(window.claude){
          let dl = null;
          try{ dl = await claude.use("downloads"); }catch(e){}
          if(dl){
            try{ await dl.save({filename:name, data:blob}); $("toast").textContent = "저장했습니다."; return; }
            catch(e){ if(e && e.code==="declined") return; }
          }
        }else{
          const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
          document.body.appendChild(a); a.click(); a.remove(); return;
        }
      }
      $("mimg").src = c.toDataURL("image/png"); $("modal").hidden = false;
    }, "image/png");
  };
  im.src = IMG[win];
}
$("mclose").onclick = () => { $("modal").hidden = true; };
</script>
</body>
</html>
